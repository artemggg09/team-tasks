# Render Blueprint: New → Blueprint → выбрать репозиторий
services:
  - type: web
    name: team-tasks
    runtime: docker
    plan: starter          # Persistent Disk доступен на платных планах
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Europe/Moscow
    disk:
      name: storage
      mountPath: /var/www/html/storage
      sizeGB: 1
